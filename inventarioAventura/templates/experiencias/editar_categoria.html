
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar categoría | Aventuras del Sur</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-success">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{% url 'actividades_user' %}">
            🌿 Aventuras del Sur
        </a>
    </div>
</nav>

<div class="container mt-5">
    <div class="card shadow-sm mx-auto" style="max-width: 650px;">
        <div class="card-header bg-success text-white">
            <h4 class="mb-0">Editar categoría</h4>
        </div>

        <div class="card-body p-4">

            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-info">{{ message }}</div>
                {% endfor %}
            {% endif %}

            <form method="POST">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label fw-bold">Nombre</label>
                    <input
                        type="text"
                        name="nombre"
                        class="form-control"
                        value="{{ categoria.nombre }}"
                        maxlength="100"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Descripción</label>
                    <textarea
                        name="descripcion"
                        class="form-control"
                        rows="4"
                        required
                    >{{ categoria.descripcion }}</textarea>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold">Estado</label>
                    <select name="estado" class="form-select">
                        <option value="True"
                            {% if categoria.estado %}selected{% endif %}>
                            Activa
                        </option>

                        <option value="False"
                            {% if not categoria.estado %}selected{% endif %}>
                            Inactiva
                        </option>
                    </select>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-success">
                        Guardar cambios
                    </button>

                    <a href="{% url 'categoria_list' %}"
                       class="btn btn-secondary">
                        Cancelar
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>
