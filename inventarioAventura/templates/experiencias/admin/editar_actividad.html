
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Editar actividad</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5 mb-5">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h3 class="mb-0">Editar actividad</h3>
        </div>

        <div class="card-body">

            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-info">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            <form method="POST">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label">Título</label>
                    <input
                        type="text"
                        name="titulo"
                        class="form-control"
                        value="{{ actividad.titulo }}"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label class="form-label">Descripción</label>
                    <textarea
                        name="descripcion"
                        class="form-control"
                        rows="4"
                        required
                    >{{ actividad.descripcion }}</textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">Precio</label>
                    <input
                        type="number"
                        name="precio"
                        class="form-control"
                        value="{{ actividad.precio }}"
                        min="0"
                        step="0.01"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label class="form-label">Cupo máximo</label>
                    <input
                        type="number"
                        name="cupo_maximo"
                        class="form-control"
                        value="{{ actividad.cupo_maximo }}"
                        min="1"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label class="form-label">Fecha y hora</label>
                    <input
                        type="datetime-local"
                        name="fecha_hora"
                        class="form-control"
                        value="{{ actividad.fecha_hora|date:'Y-m-d\\TH:i' }}"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label class="form-label">Categoría</label>
                    <select name="categoria" class="form-select" required>
                        {% for categoria in categorias %}
                            <option
                                value="{{ categoria.id }}"
                                {% if categoria.id == actividad.categoria_id %}selected{% endif %}
                            >
                                {{ categoria.nombre }}
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <button type="submit" class="btn btn-primary">
                    Guardar cambios
                </button>

                <a
                    href="{% url 'gestion_actividades_list' %}"
                    class="btn btn-secondary"
                >
                    Cancelar
                </a>

            </form>
        </div>
    </div>
</div>

</body>
</html>
