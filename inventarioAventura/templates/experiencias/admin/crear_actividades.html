
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crear actividad - Aventuras del Sur</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f1f7f2;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background-color: #198754;
        }

        .formulario {
            max-width: 750px;
            margin: 40px auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        h2 {
            color: #198754;
            font-weight: bold;
        }

        .btn-success {
            background-color: #198754;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">
                🌿 Aventuras del Sur
            </a>

            <a href="/" class="btn btn-outline-light">
                Volver al inicio
            </a>
        </div>
    </nav>

    <div class="container">

        <div class="formulario">

            <h2 class="text-center mb-2">
                Crear nueva actividad
            </h2>

            <p class="text-center text-muted mb-4">
                Registra una nueva experiencia para nuestros visitantes.
            </p>

            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-info">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            <form method="POST">
                {% csrf_token %}

                <div class="mb-3">
                    <label for="titulo" class="form-label fw-bold">
                        Título
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="titulo"
                        name="titulo"
                        placeholder="Ej: Trekking en la Patagonia"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label for="descripcion" class="form-label fw-bold">
                        Descripción
                    </label>

                    <textarea
                        class="form-control"
                        id="descripcion"
                        name="descripcion"
                        rows="4"
                        placeholder="Describe la experiencia..."
                        required
                    ></textarea>
                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label for="precio" class="form-label fw-bold">
                            Precio ($)
                        </label>

                        <input
                            type="number"
                            class="form-control"
                            id="precio"
                            name="precio"
                            min="0"
                            step="0.01"
                            placeholder="15000"
                            required
                        >
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="cupo_maximo" class="form-label fw-bold">
                            Cupo máximo
                        </label>

                        <input
                            type="number"
                            class="form-control"
                            id="cupo_maximo"
                            name="cupo_maximo"
                            min="1"
                            placeholder="10"
                            required
                        >
                    </div>

                </div>

                <div class="mb-3">
                    <label for="fecha_hora" class="form-label fw-bold">
                        Fecha y hora
                    </label>

                    <input
                        type="datetime-local"
                        class="form-control"
                        id="fecha_hora"
                        name="fecha_hora"
                        required
                    >
                </div>

                <div class="mb-4">
                    <label for="categoria" class="form-label fw-bold">
                        Categoría
                    </label>

                    <select
                        class="form-select"
                        id="categoria"
                        name="categoria"
                        required
                    >
                        <option value="">Selecciona una categoría</option>

                        {% for categoria in categorias %}
                            <option value="{{ categoria.id }}">
                                {{ categoria.nombre }}
                            </option>
                        {% endfor %}

                    </select>
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-success btn-lg">
                        Crear actividad
                    </button>
                </div>

            </form>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
