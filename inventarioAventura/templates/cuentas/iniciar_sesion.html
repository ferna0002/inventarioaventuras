
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - Aventuras del Sur</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg bg-body-tertiary shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold text-success" href="/">🌿 Aventuras del Sur</a>
        <a href="/" class="btn btn-outline-success">Volver al inicio</a>
    </div>
</nav>

<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow border-0">
                <div class="card-body p-4">

                    <h2 class="text-center text-success fw-bold mb-2">
                        Iniciar sesión
                    </h2>

                    <p class="text-center text-muted mb-4">
                        Bienvenido nuevamente a Aventuras del Sur
                    </p>

                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert alert-info">
                                {{ message }}
                            </div>
                        {% endfor %}
                    {% endif %}

                    <form method="POST">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label class="form-label">Nombre de usuario</label>
                            <input type="text" name="username"
                                   class="form-control"
                                   placeholder="Ingresa tu usuario"
                                   required>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Contraseña</label>
                            <input type="password" name="password"
                                   class="form-control"
                                   placeholder="Ingresa tu contraseña"
                                   required>
                        </div>

                        <button type="submit" class="btn btn-success w-100">
                            Iniciar sesión
                        </button>
                    </form>

                    <p class="text-center mt-4 mb-0">
                        ¿No tienes una cuenta?
                        <a href="{% url 'registro' %}" class="text-success">
                            Regístrate aquí
                        </a>
                    </p>

                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
